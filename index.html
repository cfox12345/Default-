<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ski Season Fitness</title>
  <meta name="description" content="Mobile workout tracker for a conservative return to training before ski season.">
  <meta name="theme-color" content="#0f1419">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ski Fitness">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- app:start -->
  <header class="appbar">
    <div class="appbar-inner">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20 9 8l4 6 3-4 6 10z" fill="currentColor"/></svg>
        <span>Ski Season Fitness</span>
      </a>
      <span id="save-status" class="save-status" aria-live="polite"></span>
    </div>
  </header>

  <div id="storage-warning" class="storage-warning" hidden>
    This browser is blocking local storage, so entries will not be saved. Try normal (non-private) browsing.
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Plan</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>History</span>
    </a>
    <a href="#/data" data-tab="data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>Data</span>
    </a>
  </nav>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-secondary" type="submit">Cancel</button>
        <button value="ok" id="confirm-ok" class="btn btn-danger" type="submit">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This tracker needs JavaScript enabled.</p></noscript>

<!-- app:end -->
  <script src="data/workouts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
